name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dockseed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies and run verification suite
        run: |
          poetry env use 3.11
          poetry install --no-interaction
          poetry run ruff check src/ tests/
          poetry run mypy --strict src/ tests/
          poetry run pytest -m "not integration" --cov=dockseed --cov-fail-under=95

      - name: Build distribution artifacts
        run: |
          poetry check
          poetry build

      - name: Publish package to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
